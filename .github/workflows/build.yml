name: Build
on:
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game:"
          required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # 升級到 v4
    - uses: actions/setup-java@v4  # 升級到 v4
      with:
        distribution: 'temurin'
        java-version: '17'  # 現代 Gradle 建議用 Java 17 比較穩
        cache: 'gradle'
    - run: |
        chmod +x ./gradlew
        # 自動修改模組描述和遊戲包名
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease
    - uses: actions/upload-artifact@v4  # 你已經改好的關鍵 v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
